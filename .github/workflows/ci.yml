name: Node CI

on:
  push:
    branches: [ "lab04", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: lab04

      - name: Test
        run: npm test
        working-directory: lab04

      - name: Build
        run: npm run build
        working-directory: lab04